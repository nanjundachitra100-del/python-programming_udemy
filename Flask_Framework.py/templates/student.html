<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
</head>
<body>

    <h1>Student Result</h1>

    <h2>Name: {{ name }}</h2>
    <h2>Marks: {{ marks }}</h2>
    <h2>Grade: {{ grade }}</h2>

    {% if marks >= 55 %}
        <h2>Status: Pass ✅</h2>
    {% else %}
        <h2>Status: Fail ❌</h2>
    {% endif %}

</body>
</html>
